# Local development database. Start with: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sitare_quiz
      POSTGRES_USER: sitare
      POSTGRES_PASSWORD: sitare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
